name: 'JGD provisioning engine'
description: >-
  Config-driven access/identity + GKE tenancy provisioning. Runs the multi-provider
  reconcile engine (gcp + kubernetes) against the CALLER'S projects/<key>/config.yaml.
  Dry-run by default; set apply: true to make changes.
author: 'Just-Git-Dev'

# PREREQUISITE (caller does this BEFORE calling the action): authenticate to GCP
# (e.g. google-github-actions/auth via WIF) so gcloud runs as the provisioner SA. For
# kubernetes targets, also get cluster credentials (gcloud container clusters
# get-credentials …) so kubectl is authed. This action only RUNS the engine.

inputs:
  project:
    description: 'Project key — a folder under <config-root>/projects/'
    required: true
  apply:
    description: 'Apply changes (default: dry-run / plan only)'
    required: false
    default: 'false'
  prune:
    description: 'Subtractive reconcile: remove bindings/objects config no longer declares'
    required: false
    default: 'false'
  only:
    description: 'Single subsystem/pruner (blank = all)'
    required: false
    default: ''
  config-root:
    description: 'Root holding projects/<key>/config.yaml (default: the caller workspace)'
    required: false
    default: ${{ github.workspace }}

runs:
  using: composite
  steps:
    - name: Ensure PyYAML
      shell: bash
      run: python3 -m pip install --quiet pyyaml

    # Every caller-controlled value reaches the shell through `env:`, never through
    # `${{ }}` interpolation into the script body. Interpolation splices the raw string
    # into the program text before bash sees it, so a value containing a quote or `$(…)`
    # becomes code — and these inputs come from workflow_dispatch, i.e. from whoever can
    # click Run. This action runs as a provisioner SA with IAM-admin rights; the shape is
    # not worth leaving in place even where today's values look safe. `github.action_path`
    # stays interpolated: it is set by the runner, not by the caller.
    - name: Provision
      shell: bash
      env:
        PROVISION_CONFIG_ROOT: ${{ inputs.config-root }}
        IN_PROJECT: ${{ inputs.project }}
        IN_APPLY: ${{ inputs.apply }}
        IN_PRUNE: ${{ inputs.prune }}
        IN_ONLY: ${{ inputs.only }}
      run: |
        set -eo pipefail
        ARGS=()
        [ "$IN_APPLY" = "true" ] && ARGS+=(--apply)
        [ "$IN_PRUNE" = "true" ] && ARGS+=(--prune)
        [ -n "$IN_ONLY" ] && ARGS+=(--only "$IN_ONLY")
        python3 "${{ github.action_path }}/engine/provision.py" "$IN_PROJECT" "${ARGS[@]}" \
          | tee "${GITHUB_STEP_SUMMARY:-/dev/stdout}"

branding:
  icon: 'lock'
  color: 'blue'

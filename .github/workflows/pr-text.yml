name: PR text names

# Re-checks a pull request whose title or description was EDITED, with the same `make names` the
# `names` job in ci.yml runs on open/push. A separate workflow, not `edited` on ci.yml: there an
# edit would re-run or skip every other job, and skipped results would show over the real ones.
# The list lives in the NAME_DENYLIST secret, never in the repo; it prints only the pattern
# number, never the matched text. See DECISIONS 2026-11-23.

on:
  pull_request:
    types: [edited]

permissions:
  contents: read

defaults:
  run:
    shell: bash    # GitHub's implicit default omits pipefail

concurrency:
  group: pr-text-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  names:
    name: no consumer names (PR text)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Names in files, the PR's commit messages and PR text
        env:
          NAME_DENYLIST: ${{ secrets.NAME_DENYLIST }}
          NAMES_RANGE: ${{ format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: make names

name: CI

# Engine unit tests (gcloud/kubectl seams stubbed — no cloud access) + shell lint on the
# bootstrap anchors. Keep this green: the engine mints cloud credentials, so a broken plan
# is a real risk.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash    # GitHub's implicit default omits pipefail

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.12' }
      # Every check is a make target (Makefile), the same ones `make ci` runs locally:
      # one definition, so local and CI cannot drift (tests/test_ci_make_targets.py).
      - name: Python venv from requirements-ci.txt
        run: make venv
      - name: Engine tests, bootstrap anchors (gcloud stubbed on PATH), gate tests
        run: make tests

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Lint rules change only with a commit: actionlint and shellcheck are pinned below (and in the
      # Makefile, which `make tools` checks locally; a test asserts the two agree). shellcheck: The runner image's shellcheck moves with every image update, so a
      # checksummed release goes first on PATH — for every shellcheck step in this job.
      # Same pin as `reusable-workflows` (DECISIONS 2026-10-19).
      - name: install pinned shellcheck
        env:
          SC_VERSION: v0.11.0
          SC_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          curl -sSfL -o "$RUNNER_TEMP/sc.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/${SC_VERSION}/shellcheck-${SC_VERSION}.linux.x86_64.tar.xz"
          echo "${SC_SHA256}  $RUNNER_TEMP/sc.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/sc.tar.xz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/shellcheck-${SC_VERSION}/shellcheck" --version | grep -qx "version: ${SC_VERSION#v}"
          echo "$RUNNER_TEMP/shellcheck-${SC_VERSION}" >> "$GITHUB_PATH"

      - name: shellcheck bootstrap scripts
        run: make shellcheck

      # `shellcheck bootstrap/*.sh` only ever looked at the anchors. actionlint bundles
      # shellcheck over every `run:` body too — including this file's and, via the step
      # below, the composite action's. A quoting bug in the step that invokes the engine
      # has the same blast radius as one in a bootstrap script.
      # Pinned and checksummed release, first on PATH. This replaces raven-actions/actionlint,
      # which installed AND ran actionlint; the run is now `make actionlint`, the same command
      # `make ci` runs on a laptop (explicit -shellcheck path: no fallback to the image's).
      - name: install pinned actionlint
        env:
          AL_VERSION: 1.7.12
          AL_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -sSfL -o "$RUNNER_TEMP/al.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${AL_VERSION}/actionlint_${AL_VERSION}_linux_amd64.tar.gz"
          echo "${AL_SHA256}  $RUNNER_TEMP/al.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/actionlint-${AL_VERSION}"
          tar -xzf "$RUNNER_TEMP/al.tar.gz" -C "$RUNNER_TEMP/actionlint-${AL_VERSION}" actionlint
          echo "$RUNNER_TEMP/actionlint-${AL_VERSION}" >> "$GITHUB_PATH"

      - name: Pinned linter versions match the gate
        run: make tools

      - name: actionlint
        run: make actionlint

      # Positive control. A wrong -shellcheck path makes actionlint print 'Rule "shellcheck" was
      # disabled' and exit 0, so the step above can be green with no shellcheck at all. The same
      # actionlint binary and path must find a known SC2086 in a canary workflow.
      - name: shellcheck is live inside actionlint (canary)
        run: make canary

      # actionlint lints workflows; it does not read action.yml. The composite action
      # this repo ships had nothing shellchecking its run: bodies at all.
      - name: shellcheck the composite action
        run: make composite

  # This repo is on the supply chain of every consumer that pins the action: a moved
  # tag in OUR workflows is one more way to change what runs against their cloud. Same
  # gate the consumer repos run.
  pinned:
    name: third-party actions are SHA-pinned
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reject mutable action refs
        run: make pinned
